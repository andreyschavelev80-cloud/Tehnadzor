<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#E55D00"/>
    </linearGradient>
  </defs>
  <!-- Фон: округленный квадрат (как иконка приложения) -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  
  <!-- Щит (символ защиты и технадзора) -->
  <path d="M50 15 L80 28 L80 52 C80 72 65 84 50 92 C35 84 20 72 20 52 L20 28 Z" 
        fill="none" stroke="white" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Галочка внутри щита (символ успешной приемки) -->
  <polyline points="38,52 48,62 66,40" 
            fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>